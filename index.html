// build lookup map
const map = {};
peserta.forEach(p => { map[p.no] = p; });

const inp = document.getElementById('inp');
const res = document.getElementById('result');

function cari() {
  const q = inp.value.trim();
  if (!q) { res.innerHTML = '<p class="hint">Silakan masukkan nomor ujian terlebih dahulu.</p>'; return; }
  const f = map[q];
  if (f) {
    res.innerHTML = `
      <div class="card found">
        <div class="label">Nama Peserta</div>
        <div class="nama">${f.nama}</div>
        <hr>
        <div class="row">
          <div><div class="label">No. Ujian</div><div class="value">${f.no}</div></div>
          <span class="badge b-ruang">${f.ruang}</span>
        </div>
        <div class="row">
          <div><div class="label">Sesi</div><div class="value">Sesi ${f.sesi}</div></div>
          <span class="badge b-sesi">Sesi ${f.sesi}</span>
        </div>
        <div class="row">
          <div><div class="label">No. Komputer</div><div class="komputer-num">💻 ${f.komputer}</div></div>
          <span class="badge b-komp">Komputer #${f.komputer}</span>
        </div>
      </div>`;
  } else {
    res.innerHTML = `
      <div class="card notfound">
        <div class="err-icon">❌</div>
        <p style="font-weight:700;font-size:16px;color:#1a1a1a">Nomor tidak ditemukan</p>
        <p style="font-size:13px;color:#999;margin-top:6px">Periksa kembali nomor ujian Anda</p>
      </div>`;
  }
}

inp.addEventListener('keydown', e => { if (e.key === 'Enter') cari(); });
